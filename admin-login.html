<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Área restrita — Guardião</title>
<link rel="stylesheet" href="style.css">
<style>
body{overflow:auto}.login{width:min(90vw,430px);margin:8vh auto;padding:28px;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.04)}
label{display:block;margin:15px 0 7px;opacity:.85}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#111;color:#fff;font:inherit}button{width:100%;margin-top:18px}.link-recuperacao{display:block;width:100%;margin:14px 0 0;padding:0;border:0;background:transparent;color:#fff;text-align:center;text-decoration:underline;text-underline-offset:4px;opacity:.8;cursor:pointer;font:inherit}.link-recuperacao:hover{opacity:1}.aviso{opacity:.72;line-height:1.55}.erro{min-height:1.5em;margin-top:13px;color:#ffb7b7}.sucesso{color:#bfffc7}
</style>
</head>
<body>
<main class="login">
<h1>Área restrita</h1>
<p class="aviso">Acesso exclusivo do administrador/desenvolvedor do Guardião.</p>
<form id="form-login">
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
<button id="entrar" type="submit">Entrar</button>
<button id="recuperar" class="link-recuperacao" type="button">Esqueci minha senha</button>
<p id="mensagem" class="erro" aria-live="polite"></p>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
const form=document.getElementById('form-login'), mensagem=document.getElementById('mensagem'), botao=document.getElementById('entrar'), recuperar=document.getElementById('recuperar');
const clienteSupabase=()=>window.GuardiaoSupabase||window.supabaseClient;
const params=new URLSearchParams(location.search);
if(params.get('negado')) mensagem.textContent='Esta conta não possui autorização administrativa.';

recuperar.addEventListener('click',async()=>{
 mensagem.className='erro'; mensagem.textContent='';
 const email=document.getElementById('email').value.trim();
 if(!email){mensagem.textContent='Digite seu e-mail acima para receber o link de redefinição.';document.getElementById('email').focus();return;}
 recuperar.disabled=true; recuperar.textContent='Enviando…';
 try{
  const cliente=clienteSupabase();
  if(!cliente) throw new Error(window.GuardiaoSupabaseErro||'Cliente Supabase não carregado. Atualize a página.');
  const redirectTo=new URL('redefinir-senha.html',location.href).href;
  const {error}=await cliente.auth.resetPasswordForEmail(email,{redirectTo});
  if(error) throw error;
  mensagem.className='erro sucesso';
  mensagem.textContent='Link enviado. Verifique sua caixa de entrada e o spam.';
 }catch(err){
  mensagem.className='erro';
  mensagem.textContent=err.message||'Não foi possível enviar o link de redefinição.';
 }finally{recuperar.disabled=false;recuperar.textContent='Esqueci minha senha';}
});

form.addEventListener('submit',async e=>{
 e.preventDefault(); mensagem.textContent=''; botao.disabled=true; botao.textContent='Entrando…';
 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('senha').value;
  const cliente=clienteSupabase();
  if(!cliente) throw new Error(window.GuardiaoSupabaseErro||'Cliente Supabase não carregado. Atualize a página.');
  const {error}=await cliente.auth.signInWithPassword({email,password});
  if(error) throw error;
  const {data,error:rpcError}=await cliente.rpc('verificar_admin_guardiao');
  if(rpcError||!data?.autorizado){await cliente.auth.signOut();throw new Error('Conta sem autorização administrativa.');}
  let destino=params.get('destino')||'admin-artefatos.html';
  if(!/^(admin-artefatos|admin-dev)\.html(?:[?#].*)?$/.test(destino)) destino='admin-artefatos.html';
  location.replace(destino);
 }catch(err){mensagem.textContent=err.message||'Não foi possível entrar.';}
 finally{botao.disabled=false;botao.textContent='Entrar';}
});
</script>
</body>
</html>
