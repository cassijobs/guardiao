<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Guardião</title>
    <style>
        html,body{height:100%;margin:0;background:#050505;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
        body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
        p{max-width:32rem;line-height:1.6;opacity:.86}
    </style>
</head>
<body>
    <p id="mensagem">Reconhecendo o Artefato…</p>
    <script>
        (() => {
            const curto = /^MKS-[A-Z0-9]{5}$/;
            const legado = /^GRD-MKS-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
            const partes = location.pathname.split("/").filter(Boolean);
            const codigo = decodeURIComponent(partes.at(-1) || "").trim().toUpperCase();

            if (!curto.test(codigo) && !legado.test(codigo)) {
                document.getElementById("mensagem").textContent = "Este endereço do Guardião não foi reconhecido.";
                return;
            }

            partes.pop();
            const base = `/${partes.join("/")}${partes.length ? "/" : ""}`;
            const destino = new URL(base || "/", location.origin);
            destino.searchParams.set("artefato", codigo);
            location.replace(destino.toString());
        })();
    </script>
</body>
</html>
