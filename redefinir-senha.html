<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Redefinir senha — Guardião</title>
<link rel="stylesheet" href="style.css">
<style>
body{overflow:auto}.login{width:min(90vw,430px);margin:8vh auto;padding:28px;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.04);text-align:center}
label{display:block;margin:15px 0 7px;text-align:left;opacity:.85}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#111;color:#fff;font:inherit}button{width:100%;margin-top:18px}.aviso{opacity:.72;line-height:1.55}.mensagem{min-height:1.5em;margin-top:13px;color:#ffb7b7}.sucesso{color:#bfffc7}.oculto{display:none}.voltar{display:inline-block;margin-top:18px;color:#fff;opacity:.8;text-underline-offset:4px}
</style>
</head>
<body>
<main class="login">
<h1>Nova senha</h1>
<p id="orientacao" class="aviso">Verificando o link de recuperação…</p>
<form id="form-senha" class="oculto">
<label for="nova-senha">Nova senha</label>
<input id="nova-senha" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirmar-senha">Confirmar nova senha</label>
<input id="confirmar-senha" type="password" autocomplete="new-password" minlength="8" required>
<button id="salvar" type="submit">Salvar nova senha</button>
</form>
<p id="mensagem" class="mensagem" aria-live="polite"></p>
<a class="voltar" href="admin-login.html">Voltar ao login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
const cliente=window.GuardiaoSupabase||window.supabaseClient;
const form=document.getElementById('form-senha');
const orientacao=document.getElementById('orientacao');
const mensagem=document.getElementById('mensagem');
const salvar=document.getElementById('salvar');
let recuperacaoValida=false;

function liberarFormulario(){
 recuperacaoValida=true;
 orientacao.textContent='Digite e confirme sua nova senha.';
 form.classList.remove('oculto');
 mensagem.textContent='';
}
function mostrarLinkInvalido(texto){
 recuperacaoValida=false;
 form.classList.add('oculto');
 orientacao.textContent='Não foi possível validar este link.';
 mensagem.className='mensagem';
 mensagem.textContent=texto||'O link pode ter expirado ou já ter sido usado. Solicite outro na tela de login.';
}

(async()=>{
 if(!cliente){mostrarLinkInvalido(window.GuardiaoSupabaseErro||'Cliente Supabase não carregado.');return;}
 cliente.auth.onAuthStateChange((evento,sessao)=>{
  if(evento==='PASSWORD_RECOVERY'&&sessao) liberarFormulario();
 });
 const {data,error}=await cliente.auth.getSession();
 if(error){mostrarLinkInvalido(error.message);return;}
 if(data?.session) liberarFormulario();
 else setTimeout(()=>{if(!recuperacaoValida) mostrarLinkInvalido();},1400);
})();

form.addEventListener('submit',async e=>{
 e.preventDefault();
 mensagem.className='mensagem'; mensagem.textContent='';
 const senha=document.getElementById('nova-senha').value;
 const confirmacao=document.getElementById('confirmar-senha').value;
 if(senha.length<8){mensagem.textContent='A senha deve ter pelo menos 8 caracteres.';return;}
 if(senha!==confirmacao){mensagem.textContent='As senhas não coincidem.';return;}
 salvar.disabled=true; salvar.textContent='Salvando…';
 try{
  const {error}=await cliente.auth.updateUser({password:senha});
  if(error) throw error;
  await cliente.auth.signOut();
  form.classList.add('oculto');
  orientacao.textContent='Senha redefinida com sucesso.';
  mensagem.className='mensagem sucesso';
  mensagem.textContent='Você já pode voltar ao login e entrar com a nova senha.';
 }catch(err){mensagem.textContent=err.message||'Não foi possível salvar a nova senha.';}
 finally{salvar.disabled=false;salvar.textContent='Salvar nova senha';}
});
</script>
</body>
</html>
