<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Artefatos — Mega Kraft Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
        body{overflow:visible;display:block;min-height:100dvh;height:auto;text-align:center;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
        .painel{width:min(92vw,780px);margin:0 auto;padding:28px 16px 64px;box-sizing:border-box;text-align:center}
        .cartao{border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:20px;margin:16px auto;background:rgba(255,255,255,.04);text-align:center}
        label{display:block;margin:13px 0 7px;opacity:.85;text-align:center}
        input,textarea,select{width:min(100%,620px);box-sizing:border-box;padding:12px;margin:0 auto;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#111;color:#fff;font:inherit;text-align:center;display:block}
        textarea{min-height:108px;resize:vertical}
        .acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;align-items:center}
        button,.link-botao{font:inherit;min-height:44px;padding:9px 16px;line-height:1.15}
        .aviso{opacity:.72;line-height:1.6}.status{min-height:1.5em;margin:14px 0}.status-destaque{padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.05);opacity:1}.status-destaque.erro{border-color:rgba(255,120,120,.55);color:#ffb7b7}.status-destaque.sucesso{border-color:rgba(150,255,180,.45);color:#caffd5}
        #carregando-admin{width:min(90vw,520px);margin:18vh auto;text-align:center;padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.04)}
        #erro-admin{color:#ffb7b7;margin-top:14px;line-height:1.5}
        [hidden]{display:none!important}
        .qr-code{width:220px;min-height:220px;margin:22px auto;padding:15px;background:#fff;display:flex;align-items:center;justify-content:center;color:#111;text-align:center}
        .qr-code img,.qr-code canvas{max-width:100%;height:auto!important}
        @media (max-width:560px){
            .painel{width:min(94vw,780px);padding:22px 12px calc(110px + env(safe-area-inset-bottom))}
            .cartao{padding:16px 12px}
            .acoes{gap:7px}
            button,.link-botao{width:min(100%,290px);padding:9px 13px}
            .qr-code{width:200px;min-height:200px}
        }
        @media print{body{background:#fff;color:#000}.painel>h1,.painel>.aviso,.painel>.acoes,.cartao:nth-of-type(2),label[for=base-url],#base-url,.acoes,#status{display:none!important}.painel{padding:0}.cartao{border:0;background:#fff;text-align:center}.qr-code{border:1px solid #ddd}}
    </style>
</head>
<body>
<section id="carregando-admin">
    <h1>Área restrita</h1>
    <p id="texto-carregamento" class="aviso">Verificando seu acesso…</p>
    <p id="erro-admin" aria-live="polite"></p>
    <div id="acoes-erro" class="acoes" hidden>
        <button id="tentar-novamente" type="button">Tentar novamente</button>
        <a class="link-botao" href="admin-login.html">Voltar ao login</a>
    </div>
</section>

<main id="painel-admin" class="painel" hidden>
    <h1>Gerador de Artefatos</h1>
    <p class="aviso">Mega Kraft Studio · padrão atual <strong>MKS-7ZKC4</strong></p>
    <div class="acoes"><a class="link-botao" href="admin-dev.html">Ferramentas do desenvolvedor</a><button id="sair-admin" type="button">Sair</button></div>

    <section class="cartao">
        <label for="base-url">Endereço publicado do Guardião</label>
        <input id="base-url" type="url" placeholder="https://usuario.github.io/guardiao/">
        <label for="codigo">Chave do Artefato</label>
        <input id="codigo" type="text" readonly>
        <label for="link">Endereço do Artefato</label>
        <textarea id="link" readonly></textarea>
        <div id="qr-code" class="qr-code" aria-label="QR Code do Artefato"></div>
        <p id="status" class="status aviso status-destaque" aria-live="polite">Clique em “Habilitar novo Artefato” para gerar e cadastrar uma chave.</p>
        <div class="acoes"><button id="gerar" type="button">Habilitar novo Artefato</button><button id="copiar-link" type="button">Copiar link</button><button id="copiar-codigo" type="button">Copiar chave</button><button id="imprimir-etiqueta" type="button">Imprimir etiqueta</button></div>
    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/artefato.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(async function iniciarPainel(){
    const carregando=document.getElementById('carregando-admin');
    const painel=document.getElementById('painel-admin');
    const erro=document.getElementById('erro-admin');
    const acoesErro=document.getElementById('acoes-erro');
    document.getElementById('tentar-novamente').onclick=()=>location.reload();

    try{
        const acesso=await GuardiaoAdmin.verificarAcesso();
        if(!acesso) return;
        if(!window.ArtefatoGuardiao) throw new Error('O módulo de Artefatos não foi carregado.');

        const $=id=>document.getElementById(id);
        const cliente=window.GuardiaoSupabase || window.supabaseClient;
        const codigoEl=$('codigo'),linkEl=$('link'),baseEl=$('base-url'),statusEl=$('status'),qrEl=$('qr-code');
        const botaoGerar=$('gerar');
        const baseSugerida=new URL('./',location.href);
        baseSugerida.pathname=baseSugerida.pathname.replace(/admin-artefatos\.html$/,'');
        baseSugerida.search='';baseSugerida.hash='';baseEl.value=baseSugerida.toString();

        function atualizarLink(){
            if(!codigoEl.value)return;
            try{linkEl.value=ArtefatoGuardiao.criarLink(codigoEl.value,baseEl.value,'curto');renderizarQr();}
            catch(e){linkEl.value='';statusEl.textContent=e.message||'Não foi possível criar o link.';}
        }
        function renderizarQr(){
            qrEl.innerHTML='';
            if(!linkEl.value)return;
            if(typeof QRCode==='undefined'){qrEl.textContent='QR Code indisponível. O link continua pronto para NFC.';return;}
            new QRCode(qrEl,{text:linkEl.value,width:190,height:190,correctLevel:QRCode.CorrectLevel.H});
        }
        async function habilitarNovoArtefato(){
            if(!cliente || typeof cliente.rpc !== 'function'){
                statusEl.className='status aviso status-destaque erro';
                statusEl.textContent='Conexão com o Supabase indisponível. Atualize a página e faça login novamente.';
                return;
            }

            botaoGerar.disabled=true;
            botaoGerar.textContent='Habilitando…';
            statusEl.className='status aviso status-destaque';
            statusEl.textContent='Habilitando o novo Artefato no Supabase…';
            statusEl.scrollIntoView({behavior:'smooth',block:'center'});
            codigoEl.value='';linkEl.value='';qrEl.innerHTML='';

            const comLimite=(promessa,ms=15000)=>Promise.race([
                promessa,
                new Promise((_,rejeitar)=>setTimeout(()=>rejeitar(new Error('O Supabase demorou para responder. Tente novamente.')),ms))
            ]);

            try{
                let ultimaFalha=null;
                for(let tentativa=1;tentativa<=5;tentativa++){
                    const codigo=ArtefatoGuardiao.gerarCodigo();
                    const resultado=await comLimite(cliente.rpc('habilitar_artefato_admin',{
                        p_codigo:codigo,
                        p_nome_edicao:'Guardião'
                    }));

                    const dados=typeof resultado.data==='string'
                        ? (()=>{try{return JSON.parse(resultado.data)}catch{return resultado.data}})()
                        : resultado.data;

                    if(!resultado.error && dados?.ok===true){
                        codigoEl.value=dados.codigo || codigo;
                        atualizarLink();
                        statusEl.className='status aviso status-destaque sucesso';
                        statusEl.textContent='Artefato habilitado com sucesso.';
                        botaoGerar.textContent='Habilitar outro Artefato';
                        return;
                    }

                    const detalhe=resultado.error?.message || dados?.mensagem || dados?.motivo || 'Não foi possível habilitar o Artefato.';
                    ultimaFalha=new Error(detalhe);
                    const mensagem=String(detalhe).toLowerCase();
                    if(!mensagem.includes('já está cadastrado') && !mensagem.includes('duplicate') && !mensagem.includes('unique')) break;
                }
                throw ultimaFalha || new Error('Não foi possível habilitar o Artefato.');
            }catch(e){
                console.error('Falha ao habilitar Artefato:',e);
                let mensagem=e?.message || 'Não foi possível habilitar o Artefato.';
                if(/habilitar_artefato_admin|could not find the function|schema cache/i.test(mensagem)){
                    mensagem='A função de habilitação ainda não está instalada no Supabase. Execute o arquivo SQL da versão 5.1.7 uma única vez.';
                }
                statusEl.className='status aviso status-destaque erro';
                statusEl.textContent=mensagem;
            }finally{
                botaoGerar.disabled=false;
                if(!codigoEl.value) botaoGerar.textContent='Tentar habilitar novamente';
            }
        }
        async function copiar(el){
            try{await navigator.clipboard.writeText(el.value);statusEl.textContent='Copiado.';}
            catch(e){el.select();document.execCommand('copy');statusEl.textContent='Copiado.';}
        }
        $('sair-admin').onclick=()=>GuardiaoAdmin.sair();
        $('gerar').onclick=habilitarNovoArtefato;
        $('copiar-link').onclick=()=>copiar(linkEl);
        $('copiar-codigo').onclick=()=>copiar(codigoEl);
        $('imprimir-etiqueta').onclick=()=>window.print();
        baseEl.addEventListener('input',atualizarLink);
        statusEl.textContent='Clique em “Habilitar novo Artefato” para gerar e cadastrar uma chave.';
        qrEl.textContent='O QR Code aparecerá após a habilitação.';

        carregando.hidden=true;
        painel.hidden=false;
    }catch(e){
        document.getElementById('texto-carregamento').textContent='Não foi possível abrir o painel.';
        erro.textContent=e?.message||'Erro desconhecido ao carregar a área administrativa.';
        acoesErro.hidden=false;
        console.error('Falha no painel administrativo:',e);
    }
})();
</script>
</body>
</html>
